<header class="topbar">
  <a class="brand" routerLink="/dashboard">
    <div class="brand-icon">🚕</div>
    <div>
      <div class="brand-name">EzyRide</div>
      <div class="brand-tagline">MAKING EVERY RIDE EASY</div>
    </div>
  </a>

  <nav class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
    <a routerLink="/search" routerLinkActive="active">Search</a>
    <a routerLink="/ridemate" routerLinkActive="active">RideMate</a>
    <a routerLink="/chat" routerLinkActive="active">Chat</a>
    <a routerLink="/profile" routerLinkActive="active">Profile</a>
  </nav>

  <div class="account-actions">
    <button class="notification" title="Notifications">♧<span>2</span></button>
    <button class="avatar" routerLink="/profile" [title]="user?.name || 'Profile'">{{ initials }}</button>
  </div>
</header>
