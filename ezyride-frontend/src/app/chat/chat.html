<div class="page"><app-header></app-header><main class="chat-wrap"><aside class="contacts card"><h3>Chats</h3>@for(c of contacts;track c){<button [class.active]="selected===c" (click)="selected=c">● {{c}}</button>}</aside><section class="chat card"><header><span>💬</span><div><strong>{{selected}}</strong><small>Online · EzyRide chat</small></div></header><div class="messages">@for(m of messages;track $index){<div class="bubble" [class.mine]="m.mine"><small>{{m.from}}</small>{{m.text}}</div>}</div><div class="composer"><input [(ngModel)]="message" (keyup.enter)="send()" placeholder="Write a message..."><button (click)="send()">➤</button></div></section></main></div>
